{% extends 'base.html' %}

{% block title %}Удаление рассылки{% endblock %}
{% block header %}Удаление рассылки{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="alert alert-danger">
            Удалить рассылку <strong>{{ object.message.subject }}</strong>?
            Действие необратимо.
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between">
                <a href="{% url 'mailing:mailing_list' %}" class="btn btn-outline-secondary">Отмена</a>
                <button type="submit" class="btn btn-danger">Удалить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
