{% extends 'base.html' %}

{% block title %}Главная{% endblock %}
{% block header %}Сервис рассылок{% endblock %}

{% block content %}
<div class="row text-center">
    <div class="col-md-4">
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Всего рассылок</h5>
                <p class="display-4">{{ total_mailings }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Активных рассылок</h5>
                <p class="display-4">{{ active_mailings }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Уникальных получателей</h5>
                <p class="display-4">{{ unique_recipients }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
