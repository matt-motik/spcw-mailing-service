[project]
name = "spcw-mailing-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-environ>=0.14.0",
    "django-redis>=7.0.0",
    "ipython>=9.16.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
lint = [
    "mypy>=2.3.1",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py314"
line-length = 119
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "D",   # pydocstyle
]
ignore = [
    "E203",  # whitespace before ':'
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["D", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["^.venv/", "^venv/", "__pycache__", "tests/", "^.*/migrations/.*$"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = [".", "config"]

[tool.coverage.run]
source = ["."]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "pass",
]
