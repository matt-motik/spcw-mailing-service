<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">BlastMail</h5>
    <nav class="nav nav-pills ms-5 gap-2">
        <a class="nav-item btn btn-outline-primary" href="{% url 'mailing:index' %}">
            <i class="bi bi-house-door me-2"></i>Главная</a>
        <a class="nav-item btn btn-outline-primary" href="{% url 'mailing:mailing_list' %}">
            <i class="bi bi-send me-2"></i>Рассылки</a>
        <a class="nav-item btn btn-outline-primary" href="{% url 'mailing:recipient_list' %}">
            <i class="bi bi-people me-2"></i>Получатели</a>
        <a class="nav-item btn btn-outline-primary" href="{% url 'mailing:message_list' %}">
            <i class="bi bi-envelope me-2"></i>Сообщения</a>
        <a class="nav-item btn btn-outline-primary" href="{% url 'mailing:statistics' %}">
            <i class="bi bi-bar-chart me-2"></i>Статистика</a>

        {% if user.is_authenticated %}
            <div class="dropdown">
                <button class="btn btn-outline-primary dropdown-toggle" type="button"
                        id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle me-2"></i>{{ user.email }}
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                    <li>
                        <a class="dropdown-item" href="{% url 'users:profile' %}">
                            <i class="bi bi-person-gear me-2"></i>Профиль
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" href="{% url 'users:password_change' %}">
                            <i class="bi bi-key me-2"></i>Сменить пароль
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form method="post" action="{% url 'users:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="dropdown-item text-danger">
                                <i class="bi bi-box-arrow-right me-2"></i>Выйти
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        {% else %}
            <a class="nav-item btn btn-outline-primary" href="{% url 'users:login' %}">
                <i class="bi bi-box-arrow-in-right me-2"></i>Войти</a>
            <a class="nav-item btn btn-primary" href="{% url 'users:register' %}">
                <i class="bi bi-person-plus me-2"></i>Регистрация</a>
        {% endif %}
    </nav>
</div>
